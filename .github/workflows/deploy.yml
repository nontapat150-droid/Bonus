name: 🚀 Fast Deploy PHP to z.com

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    name: 🌐 Fast Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Get latest code (Checkout)
        uses: actions/checkout@v4

      - name: 📂 Sync files to File Manager
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          server-dir: ./ 
          protocol: ftp
          port: 21
          
          # เปลี่ยนเป็น minimal เพื่อให้ Log อ่านง่าย ไม่รกจนเกินไป
          log-level: minimal 
          
          # 🛑 บล็อกไฟล์ขยะ โฟลเดอร์ระบบ และไฟล์ตั้งค่าฐานข้อมูล
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            config/db.php
            node_modules/**
            package.json
            package-lock.json
            .agents/**
            sql/**
            tools/**
            *.md
            *.py
